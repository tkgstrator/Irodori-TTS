services:
  train:
    build:
      context: ../..
      dockerfile: docker/train/Dockerfile
    image: ghcr.io/tkgstrator/irodori-tts-train:latest
    container_name: irodori-tts-train
    env_file:
      # Expected keys in .env:
      #   HF_TOKEN
      #   ATMOS_TOKEN               (used only when METRICS_BACKEND=atmos)
      #   ATMOS_API_URL             (used only when METRICS_BACKEND=atmos;
      #                              e.g. https://atmos-staging.qleap.jp)
      #   ATMOS_VISIBILITY          (used only when METRICS_BACKEND=atmos)
      - ../../.env
    environment:
      HF_HOME: /root/.cache/huggingface
      # Override these at `docker compose run` time:
      #   HF_DATASET: <org>/irodori-tts-voices
      #   SPEAKERS: <speaker1>,<speaker2>
      #   NUM_GPUS: 8
      #   NO_RESUME: "true"
      #   METRICS_BACKEND: atmos    (default: none)
      #   METRICS_PROJECT: <project name>
    volumes:
      - ../../data:/app/data
      - ../../outputs:/app/outputs
      - ../../models:/app/models
      - hf_cache:/root/.cache/huggingface
      - uv_cache:/root/.cache/uv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
  uv_cache:
