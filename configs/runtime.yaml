# Which upstream generation to serve. The repo id is derived from this, so the
# adapters under lora_dir must be trained against the same generation.
# Known values: v4.1-small, v4-small, v3, v2, v1.
base_version: v4.1-small
# base_hf_repo / base_hf_filename override the alias for a fork or a renamed
# weight file; base_hf_repo and base_version are mutually exclusive.
# base_checkpoint points at an already-downloaded file and skips the fetch; it
# falls back to the repo above when the file is absent.
base_checkpoint: models/Irodori-TTS-v4.1-Small/model.safetensors

model_device: cuda
codec_device: cuda
model_precision: bf16
codec_precision: bf16
codec_repo: Aratako/Semantic-DACVAE-Japanese-32dim
codec_deterministic_encode: true
codec_deterministic_decode: true

# SilentCipher watermarking. The runtime applies it whenever the package loads,
# so this is the only way to turn it off; unset means on.
enable_watermark: false

# The id GET /v1/models advertises and POST /v1/audio/speech requires in its
# `model` field. Unset derives it from base_version, e.g. irodori-tts-v4.1-small.
# model_id: irodori-tts-v4.1-small

# LoRA adapters are auto-discovered as single-file .safetensors exports under
# this directory, searched recursively, so the published layout
# (<generation>/<category>/<speaker>.safetensors) can be downloaded as-is. Each
# file carries its own metadata (name, uuid, defaults, adapter_config) so no
# per-speaker block is required. Keep only one generation's adapters under this
# directory: a v3 adapter loaded against the v4.1 base is a mismatch.
#
# To add a new speaker: export a PEFT checkpoint to a .safetensors file with
#   uv run python scripts/lora/export_lora_to_safetensors.py \
#     --input outputs/<speaker>_lora/checkpoint_xxx \
#     --output models/LoRA/<speaker>.safetensors \
#     --defaults '{"num_steps": 40, "cfg_scale_text": 3.0, "cfg_scale_speaker": 5.0}'
# The embedded display name is taken from data/<speaker>/config.yaml speaker.label.
lora_dir: models/LoRA

# How many adapters stay resident on the device. An r=16 adapter is ~53 MB, so
# a full speaker set outweighs the base checkpoint and will not fit in VRAM;
# the rest load on request and the least recently used one is evicted. Raise it
# if the card has room — a warm adapter answers without paying the load. Set 0
# to keep every adapter loaded, which only suits a small speaker set.
# TTS_MAX_LOADED_ADAPTERS in the environment overrides this (kept for
# deployments that predate the config key).
lora_slots: 16

# Speaker uuid loaded at startup and never evicted — point it at the bot's
# default voice so the common case never pays a reload. Unset picks the first
# discovered speaker. TTS_PRELOAD_SPEAKER_ID in the environment overrides it.
# preload_speaker: c3a337b8-6df0-5e7e-9fad-adf44666543c
