# LoRA fine-tuning configuration for Irodori-TTS-v4-Large.
#
# The model section matches the released Large checkpoint. The LoRA section
# follows the v4-Small adapter recipe: train diffusion attention and retain the
# Large duration predictor with the adapter.

model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 262144
  text_tokenizer_repo: google/t5gemma-2-1b-1b
  text_encoder_revision: dd0a2683227859151b1730ca3a63087df5b5f39b
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 2048
  num_layers: 24
  num_heads: 32
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 1280
  speaker_dim: 1280
  speaker_layers: 14
  speaker_heads: 20
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 256
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 262144
  caption_tokenizer_repo: google/t5gemma-2-1b-1b
  caption_add_bos: true
  caption_dim: 1280
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1280
  duration_layers: 4
  duration_dropout: 0.1
  duration_attention_heads: 20
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf
  # A100 80GB: effective batch 80 without activation recomputation.
  # Longer clips may require a smaller microbatch and more accumulation.
  batch_size: 40
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: true
  length_bucket_window_batches: 64
  latent_length_bucket_size: 0
  allow_tf32: true
  compile_model: false
  precision: bf16
  optimizer: adamw
  learning_rate: 0.0001
  pretrained_text_encoder_learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 1000
  stable_steps: 24000
  min_lr_scale: 0.01
  max_steps: 30000
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  timestep_stratified: true
  max_latent_steps: 750
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1
  log_every: 100
  save_every: 250
  checkpoint_best_n: 5
  metrics_project: irodori-tts-v4-large
  metrics_run_name:
  ddp_find_unused_parameters: false
  valid_ratio: 0.0005
  valid_every: 100
  lora_enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_bias: none
  lora_target_modules: diffusion_attn
  lora_modules_to_save: auto
  seed: 0

sample_generation:
  enabled: true
  every: 250
  on_best_val: false
  num_steps: 32
  cfg_scale_text: 3.0
  cfg_scale_caption: 3.0
  cfg_scale_speaker: 5.0
  cfg_guidance_mode: independent
  codec_device: cuda
